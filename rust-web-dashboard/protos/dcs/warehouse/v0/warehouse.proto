syntax = "proto3";
package dcs.warehouse.v0;

message GetInventoryRequest {
  string airbase_name = 1;
  string static_name = 2;
}

message GetInventoryResponse {
  string inventory_json = 1;
}

message GetItemCountRequest {
  string airbase_name = 1;
  string static_name = 2;
  string item_name = 3;
}

message GetItemCountResponse {
  int32 count = 1;
}

message AddItemRequest {
  string airbase_name = 1;
  string static_name = 2;
  string item_name = 3;
  int32 count = 4;
}

message AddItemResponse {}

message RemoveItemRequest {
  string airbase_name = 1;
  string static_name = 2;
  string item_name = 3;
  int32 count = 4;
}

message RemoveItemResponse {}

message SetItemRequest {
  string airbase_name = 1;
  string static_name = 2;
  string item_name = 3;
  int32 count = 4;
}

message SetItemResponse {}

message GetLiquidAmountRequest {
  string airbase_name = 1;
  string static_name = 2;
  int32 liquid_type = 3;
}

message GetLiquidAmountResponse {
  double amount = 1;
}

message AddLiquidRequest {
  string airbase_name = 1;
  string static_name = 2;
  int32 liquid_type = 3;
  double amount = 4;
}

message AddLiquidResponse {}

message SetLiquidAmountRequest {
  string airbase_name = 1;
  string static_name = 2;
  int32 liquid_type = 3;
  double amount = 4;
}

message SetLiquidAmountResponse {}

message GetOwnerRequest {
  string airbase_name = 1;
  string static_name = 2;
}

message GetOwnerResponse {
  string airbase_name = 1;
  string static_name = 2;
}

service WarehouseService {
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse) {}
  rpc GetItemCount(GetItemCountRequest) returns (GetItemCountResponse) {}
  rpc AddItem(AddItemRequest) returns (AddItemResponse) {}
  rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse) {}
  rpc SetItem(SetItemRequest) returns (SetItemResponse) {}
  rpc GetLiquidAmount(GetLiquidAmountRequest) returns (GetLiquidAmountResponse) {}
  rpc AddLiquid(AddLiquidRequest) returns (AddLiquidResponse) {}
  rpc SetLiquidAmount(SetLiquidAmountRequest) returns (SetLiquidAmountResponse) {}
  rpc GetOwner(GetOwnerRequest) returns (GetOwnerResponse) {}
}
